#             test comment). The no-navigator world does NOT catch a bare-`navigator` read: it falls
#             through new Function's scope chain to Node 24's real global, which reports this
#             machine's es-CO and resolves `es` — exactly what that world expects. navigatorThrows is
#             equally blind (its getter sits on windowStub). What catches D1 is the languages axis
