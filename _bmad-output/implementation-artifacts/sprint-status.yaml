#
#             CODE REVIEW OF 3-5 (three layers). All six ACs and all twelve ruled decisions were
#             confirmed honoured; the shipped behaviour was correct. 11 patches applied, of which
#             two amend rulings and MUST NOT be mistaken for drift by a later session:
#
#             D3 IS AMENDED. The guard is now `typeof preferred === "string" && preferred` in BOTH
#             implementations. Reason, and it is a defect 3.5 introduced: `language()` try/catches
#             only the READ, so a truthy NON-STRING navigator.language threw out of `.toLowerCase()`
#             inside resolveLocale — which runs AFTER language() returns and BEFORE the theme is
#             resolved, so the escape cost the visitor <html lang>, the locale class AND their
#             persisted theme. Before 3.5 the locale path was only `===` comparisons and could not
#             throw. Both copies carry the identical guard, so D4's "same shape" still holds.
#
#             D2 IS INTACT, but resolveLocale now takes a DEFAULTED third parameter,
#             `fallback = DEFAULT_LOCALE`. `preferred` stays REQUIRED so D2's typecheck gate is
#             untouched. The provider passes its `initialLocale` as the fallback. This makes the
#             effect's three-tier precedence comment TRUE — it was FALSE: initialLocale only seeded
#             the pre-effect render and was then overwritten, so `<LocaleProvider initialLocale="en">`
#             on an fr-FR browser rendered `es`. Task 5.2's own wording instructed that false comment.
#             The ES5 literal has no initialLocale and keeps its hardcoded `es`; the drift matrix
#             calls the two-arg form, so the cross-check still holds — and GAINS a catch, since a
#             future move of DEFAULT_LOCALE to `en` would now turn the matrix red against the literal.
#
#             THE DRIFT MATRIX WAS NOT CATCHING THE TWO THINGS ITS SIBLINGS PIN. The `languages`
#             axis was [undefined, "en-US", "es-CO", "fr-FR", ""] — every uppercase character sat in
#             a REGION subtag and no value distinguished prefix-matching from exact-matching. A
#             literal that alone dropped `.toLowerCase()`, or alone switched to `indexOf("en") === 0`,
#             produced identical output on all five values and the matrix stayed GREEN, while the
#             pure-function tests that DO pin those behaviours never look at the literal. Added
#             "EN-US" and "enm"; 240 -> 336 combinations. Both mutations were then driven RED and
#             each names EXACTLY the entry that was added, which is the proof the old axis was blind.
